let AC=null;const lastS={};
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function beep(f,d,type='square',v=0.04,slide=0,delay=0){if(!AC)return;try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.02)}catch(e){}}
function noise(d,v){if(!AC)return;try{const b=AC.createBuffer(1,fl(AC.sampleRate*d),AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);
 const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g);g.connect(AC.destination);s.start()}catch(e){}}

function drawUI(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,UW,UH);if(st!=='title'){drawWorldUI();drawHUD()}drawOverlay();
 if(isTouch&&innerHeight>innerWidth){ctx.fillStyle=P.o;ctx.fillRect(0,0,UW,UH);txtC('TELEFONU YAN ÇEVİR',UW/2,UH/2-8,P.gold);txtC('OYUN YATAY OYNANIR',UW/2,UH/2+4,P.gr)}}

/* ================= INPUT & LOOP ================= */
let fitRect={x:0,y:0,w:UW,h:UH};
function resize(){setUIRes();const d=window.devicePixelRatio||1,k=Math.min(innerWidth/UW,innerHeight/UH),cw=UW*k,ch=UH*k;fitRect={x:(innerWidth-cw)/2,y:(innerHeight-ch)/2,w:cw,h:ch};
 for(const el of[cv,renderer.domElement]){el.style.width=cw+'px';el.style.height=ch+'px';el.style.left=fitRect.x+'px';el.style.top=fitRect.y+'px'}
 cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);const n=Math.max(1,Math.ceil(cv.width/UW));up.width=UW*n;up.height=UH*n;
 const pr=Math.min(d,quality?(isTouch?1.25:1.5):0.75);renderer.setPixelRatio(pr);renderer.setSize(cw,ch,false);composer.setPixelRatio(pr);composer.setSize(cw,ch);bloomPass.resolution.set(cw/2,ch/2)}
function present(){uctx.clearRect(0,0,up.width,up.height);uctx.imageSmoothingEnabled=false;uctx.drawImage(lo,0,0,up.width,up.height);cctx.clearRect(0,0,cv.width,cv.height);cctx.imageSmoothingEnabled=true;cctx.imageSmoothingQuality='high';cctx.drawImage(up,0,0,cv.width,cv.height)}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}}).catch(()=>{})}catch(_){}}
function setQuality(q){quality=q;bloomPass.enabled=!!q;renderer.shadowMap.enabled=!!q;scene.traverse(o=>{if(o.material)o.material.needsUpdate=true});resize();banner(q?'KALİTE: YÜKSEK':'KALİTE: DÜŞÜK (HIZLI)',P.w)}
function lpos(ev){return[fl((ev.clientX-fitRect.x)/fitRect.w*UW),fl((ev.clientY-fitRect.y)/fitRect.h*UH)]}
const inR=(x,y,r)=>r&&x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
function pickCard(i){if(!cards[i])return;cards[i].f();sfx('place');
 if(st==='draft'){if(draftStep===0){draftStep=1;openDraft()}else{st='play';banner('1. BÖLÜM: ÇATLAK',P.w,2.5);sfx('wave')}}else st='play'}
function newGame(){for(const[t,o]of towerObjs)scene.remove(o.g);towerObjs.clear();reset();draftStep=0;openDraft()}
function updMouse(ev){const[x,y]=lpos(ev);um.x=x;um.y=y;const f=fieldFromClient(ev.clientX,ev.clientY);if(f){mouse.x=f.x;mouse.y=f.y}}
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('pointermove',ev=>{if(ev.pointerType!=='touch')updMouse(ev)});
function fieldAction(){if(paused||um.y<TOP||um.y>=UH-BOT)return;
 const pp=pitAt(mouse.x,mouse.y);if(pp){selPit=selPit===pp?null:pp;selT=null;sfx('tick');return}
 const hc=hoverCell();if(!hc)return;const ex=grid[hc.c][hc.r];
 if(ex){selT=selT===ex?null:ex;selPit=null;sfx('tick');return}
 if(selT||selPit){selT=null;selPit=null;return}
 placeTower(hc.c,hc.r)}
function uiPress(x,y){
 if(st==='title'){if(isTouch&&!document.fullscreenElement)toggleFS();newGame();return true}
 if(st==='over'){if(overT>1)newGame();return true}
 if(st==='win'){if(overT>1){endless=true;st='play';banner('SONSUZ MOD',P.xp)}return true}
 if(st==='book'){st='play';return true}
 if(st==='draft'||st==='level'||st==='act'){cardRects(cards.length).forEach((r,i)=>{if(inR(x,y,r))pickCard(i)});return true}
 for(const b of uiBtns)if(inR(x,y,b)){b.act();return true}
 if((selT||selPit)&&inR(x,y,infoBtns.box)){for(const b of infoBtns)if(inR(x,y,b)&&b.on)b.act();return true}
 return false}
// ---- touch ----
const tp=new Map();let tap=null,pinch=null;
function tpDist(){const a=[...tp.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function tpMid(){const a=[...tp.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
addEventListener('pointerdown',ev=>{ev.preventDefault();initAudio();
 if(ev.pointerType==='touch'){tp.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(tp.size===2){tap=null;rmb=false;pinch={d:tpDist(),m:tpMid(),z:camZoomT};return}if(tp.size>2)return;
  updMouse(ev);if(uiPress(um.x,um.y))return;if(st!=='play')return;
  tap={sx:ev.clientX,sy:ev.clientY,lx:ev.clientX,ly:ev.clientY,t0:performance.now(),moved:false,shield:false};return}
 updMouse(ev);const x=um.x,y=um.y;if(ev.button===1){midDrag={x:ev.clientX,y:ev.clientY};return}
 if(ev.button===2){if(st==='play'){if(selT||selPit){selT=null;selPit=null;return}rmb=true}return}
 if(uiPress(x,y))return;if(st==='play')fieldAction()});
addEventListener('pointermove',ev=>{if(ev.pointerType!=='touch')return;if(!tp.has(ev.pointerId))return;tp.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
 if(pinch&&tp.size===2){const d=tpDist(),m=tpMid();camZoomT=clamp(pinch.z*pinch.d/Math.max(20,d),0.38,1);camZoom=camZoomT;
  const k=0.05*camZoom;camTgt.x-=(m.x-pinch.m.x)*k;camTgt.z-=(m.y-pinch.m.y)*k;pinch.m=m;return}
 if(!tap)return;updMouse(ev);
 if(tap.shield)return;
 if(!tap.moved&&Math.hypot(ev.clientX-tap.sx,ev.clientY-tap.sy)>12)tap.moved=true;
 if(tap.moved){const k=0.05*camZoom;camTgt.x-=(ev.clientX-tap.lx)*k;camTgt.z-=(ev.clientY-tap.ly)*k}
 tap.lx=ev.clientX;tap.ly=ev.clientY},{passive:false});
function touchEnd(ev){if(ev.pointerType!=='touch')return;tp.delete(ev.pointerId);
 if(pinch){if(tp.size<2)pinch=null;tap=null;return}
 if(tap){const t=tap;tap=null;rmb=false;if(!t.moved&&!t.shield&&st==='play')fieldAction()}}
addEventListener('pointerup',touchEnd);addEventListener('pointercancel',touchEnd);
addEventListener('pointerup',ev=>{if(ev.button===2)rmb=false;if(ev.button===1)midDrag=null});
let midDrag=null;
addEventListener('wheel',ev=>{ev.preventDefault();const zin=ev.deltaY<0;camZoomT=clamp(camZoomT*(zin?1/1.15:1.15),0.38,1);
 if(zin){const f=fieldFromClient(ev.clientX,ev.clientY);if(f){camTgt.x+=(WX(f.x)-camTgt.x)*0.18;camTgt.z+=(WZ(f.y)-camTgt.z)*0.18}}},{passive:false});
addEventListener('pointermove',ev=>{if(midDrag){const k=0.045*camZoom;camTgt.x-=(ev.clientX-midDrag.x)*k;camTgt.z-=(ev.clientY-midDrag.y)*k;midDrag={x:ev.clientX,y:ev.clientY}}});
addEventListener('keyup',e=>{panKeys[e.key.toLowerCase()]=false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k.startsWith('arrow')){panKeys[k]=true;e.preventDefault();return}if(k==='0'){camZoomT=1;camTgt.copy(camCenter);return}
 if((st==='draft'||st==='level'||st==='act')&&k>='1'&&k<='3'){pickCard(+k-1);return}
 if(st==='win'&&k==='n'){newGame();return}
 if(k==='t'){toggleFS();return}if(k==='q'){setQuality(quality?0:1);return}
 if(st!=='play')return;
 if(k>='1'&&k<='6'){const i=+k-1;if(owned.has(i)){sel=i;selT=null;selPit=null}}
 else if(k==='u'&&selT)upgrade(selT);else if(k==='s'&&selT)sell(selT);else if(k==='b'&&selT)fuse(selT);
 else if(k===' '){paused=!paused;e.preventDefault()}else if(k==='f')speed=speed%3+1;else if(k==='escape'){selT=null;selPit=null}else if(k==='d')st='book'});
addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);addEventListener('blur',()=>{rmb=false});
initLayers();init3D();reset();resize();
cv.style.pointerEvents='none';
let last=performance.now(),fpsT=0,fpsN=0,lowAsked=false;
function loop(t){const dt=Math.min(0.05,(t-last)/1000);last=t;
 if(st==='play'&&!paused){for(let i=0;i<speed&&st==='play';i++){update(dt);if(pending&&pending.t<=0)openPit()}}
 else{time+=dt;if(st==='over'||st==='win'){overT+=dt;for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt}parts=parts.filter(p=>p.life>0);shake=Math.max(0,shake-dt)}}
 if(tap&&!tap.moved&&!tap.shield&&performance.now()-tap.t0>350&&st==='play'){tap.shield=true;rmb=true;try{navigator.vibrate&&navigator.vibrate(20)}catch(_){}}
 sync3D(dt);composer.render();drawUI();present();
 fpsT+=dt;fpsN++;if(fpsT>4){const fps=fpsN/fpsT;fpsT=0;fpsN=0;if(fps<28&&quality&&!lowAsked&&st==='play'){lowAsked=true;setQuality(0)}}
 requestAnimationFrame(loop)}
requestAnimationFrame(loop);


</script>
